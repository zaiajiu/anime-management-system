# ===== 服务器 =====
server.port=8080

# DeepSeek 配置
deepseek.api.key=your_key

# ===== 数据库（你已有，保持不变）=====
spring.datasource.url=jdbc:mysql://localhost:3306/book_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== 图片上传 =====
# 相对项目根目录，也可改成绝对路径，如 D:/book-system/uploads
app.upload.dir=uploads

# 单文件最大 5MB，单请求最大 10MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB